name: Docker Worker Image

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# PR runs are cancelled when superseded; pushes to main (which publish images) never are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.9.30"
          enable-cache: true

      - name: Sync locked backend dependencies
        run: uv sync --frozen --no-dev --no-install-project

      # The browser download + apt deps once took 13+ minutes on a cold runner; cache the browser binaries.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install test browser
        timeout-minutes: 10
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            uv run --frozen python -m playwright install-deps chromium
          else
            uv run --frozen python -m playwright install --with-deps chromium
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify backend, frontend and browser workflow
        run: uv run --frozen python scripts/verify.py full

      - name: Upload verification logs and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: ${{ runner.temp }}/pulseguard-verify-*
          if-no-files-found: ignore

  build-worker:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          ref="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]')"
          tag="$(echo "${ref}" | sed -E 's/[^a-z0-9_.-]+/-/g')"
          worker_image="ghcr.io/${owner}/pulseguard-worker"
          updater_image="ghcr.io/${owner}/pulseguard-worker-updater"
          {
            echo "worker_tags<<EOF"
            echo "${worker_image}:${tag}"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${worker_image}:latest"
            fi
            echo "EOF"
            echo "updater_tags<<EOF"
            echo "${updater_image}:${tag}"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${updater_image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.image.outputs.worker_tags }}
          build-args: |
            PULSEGUARD_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and push updater image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker-updater
          push: true
          tags: ${{ steps.image.outputs.updater_tags }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater
