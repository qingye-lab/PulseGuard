name: Docker Worker Image

on:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PULSEGUARD_DB_PATH: ${{ runner.temp }}/pulseguard-test/pulseguard.db
      PULSEGUARD_DATA_DIR: ${{ runner.temp }}/pulseguard-test/data
      PULSEGUARD_REPORTS_DIR: ${{ runner.temp }}/pulseguard-test/reports
      PULSEGUARD_BACKUPS_DIR: ${{ runner.temp }}/pulseguard-test/backups
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.30"
          enable-cache: true

      - name: Sync locked backend dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Initialize isolated test database
        run: uv run python -c "from backend.app import storage; storage.init_db()"

      - name: Run backend tests
        run: uv run python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-worker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          ref="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]')"
          tag="$(echo "${ref}" | sed -E 's/[^a-z0-9_.-]+/-/g')"
          worker_image="ghcr.io/${owner}/pulseguard-worker"
          updater_image="ghcr.io/${owner}/pulseguard-worker-updater"
          {
            echo "worker_tags<<EOF"
            echo "${worker_image}:${tag}"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${worker_image}:latest"
            fi
            echo "EOF"
            echo "updater_tags<<EOF"
            echo "${updater_image}:${tag}"
            if [ "${GITHUB_REF_NAME}" = "main" ]; then
              echo "${updater_image}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ${{ steps.image.outputs.worker_tags }}
          build-args: |
            PULSEGUARD_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push updater image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker-updater
          push: true
          tags: ${{ steps.image.outputs.updater_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
