services:
  pulseguard:
    build:
      context: .
      args:
        # The team badge is deployment branding. Leave unset for the public
        # build; internal deployments set it in .env.
        VITE_APP_TEAM_NAME: ${VITE_APP_TEAM_NAME:-}
    container_name: pulseguard
    restart: unless-stopped
    ports:
      - "${PULSEGUARD_PUBLISH_HOST:-0.0.0.0}:${PULSEGUARD_PUBLISH_PORT:-8787}:${PULSEGUARD_PORT:-8787}"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PULSEGUARD_HOST=${PULSEGUARD_HOST:-0.0.0.0}
      - PULSEGUARD_PORT=${PULSEGUARD_PORT:-8787}
      - PULSEGUARD_ALERT_DETAIL_BASE_URL=${PULSEGUARD_ALERT_DETAIL_BASE_URL:-http://localhost:8787}
      - PULSEGUARD_DATA_DIR=/app/data
      - PULSEGUARD_REPORTS_DIR=/app/reports
      - PULSEGUARD_TREND_BACKFILL_ON_STARTUP=${PULSEGUARD_TREND_BACKFILL_ON_STARTUP:-false}
    mem_limit: 1g
    cpus: 1.0
